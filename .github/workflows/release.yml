name: Release & Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (например, v1.2.3)'
        required: true
        default: 'v0.0.0'
      platforms:
        description: 'Какие платформы собрать (через запятую: windows,linux,macos,ios)'
        required: false
        default: 'windows,linux,macos,ios'
      create_draft:
        description: 'Создать draft-релиз? (true/false)'
        required: true
        type: boolean
        default: true

env:
  APP_NAME: "ScheduleAAG"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096M -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:

  build-desktop-windows:
    name: Build Desktop Windows
    runs-on: windows-latest
    if: contains(github.event.inputs.platforms, 'windows')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Gradle
        uses: ./.github/actions/gradle-setup

      - name: Build Windows Exe Installer
        run: ./gradlew :composeApp:packageReleaseExe

      - name: Upload Windows Exe Installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-installer
          path: composeApp/build/compose/binaries/main-release/exe/*.exe

      - name: Build Portable Distributable
        run: ./gradlew :composeApp:createReleaseDistributable

      - name: Package Portable Distributable (zip)
        run: |
            7z a -r desktop-windows-portable.zip ./composeApp/build/compose/binaries/main-release/app/

      - name: Upload Portable Distributable (zip)
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-portable
          path: desktop-windows-portable.zip

  build-desktop-linux:
    name: Build Desktop Linux
    runs-on: ubuntu-latest
    if: contains(github.event.inputs.platforms, 'linux')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gradle setup
        uses: ./.github/actions/gradle-setup

      - name: Build Linux DEB
        run: ./gradlew :composeApp:packageReleaseDeb

      - name: Upload Linux DEB
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-deb
          path: composeApp/build/compose/binaries/main-release/deb/*.deb

  build-desktop-macos:
    name: Build Desktop macOS
    runs-on: macos-latest
    if: contains(github.event.inputs.platforms, 'macos')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gradle setup
        uses: ./.github/actions/gradle-setup

      - name: Build macOS DMG
        run: ./gradlew :composeApp:packageReleaseDmg

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-dmg
          path: composeApp/build/compose/binaries/main-release/dmg/*.dmg

  build-ios:
    name: Build iOS app (unsigned IPA)
    runs-on: macos-latest
    if: contains(github.event.inputs.platforms, 'ios')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gradle setup
        uses: ./.github/actions/gradle-setup

      - name: UpdateIosConfig
        run: ./gradlew :composeApp:configureIosXcode

      - name: Generate AppConfig
        run: ./gradlew :composeApp:generateAppConfig

      - name: Build iOS device app (Release, unsigned)
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -configuration Release \
            -scheme iosApp \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -verbose

      - name: Package unsigned .app into .ipa
        run: |
          APP_PATH=$(find ./build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found in ./build/Build/Products/Release-iphoneos"
            exit 1
          fi
          echo "Found app at $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r iosApp.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: iosApp-unsigned
          path: iosApp.ipa

  create-draft-release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    needs:
      - build-desktop-windows
      - build-desktop-linux
      - build-desktop-macos
      - build-ios
    if: |
      always() &&
      !cancelled() &&
      github.event.inputs.create_draft == true &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Переименовать файлы в формат ScheduleAAG-<version>-<platform>
        run: |
          VERSION="${{ github.event.inputs.version }}"
          APP="${{ env.APP_NAME }}"
          
          # Windows installer (.exe)
          if [ -f ./artifacts/desktop-windows-installer/*.exe ]; then
            mv ./artifacts/desktop-windows-installer/*.exe "./artifacts/desktop-windows-installer/${APP}-${VERSION}-windows-installer.exe"
          fi
          
          # Windows portable (.zip)
          if [ -f ./artifacts/desktop-windows-portable/*.zip ]; then
            mv ./artifacts/desktop-windows-portable/*.zip "./artifacts/desktop-windows-portable/${APP}-${VERSION}-windows-portable.zip"
          fi
          
          # Linux (.deb)
          if [ -f ./artifacts/desktop-linux-deb/*.deb ]; then
            mv ./artifacts/desktop-linux-deb/*.deb "./artifacts/desktop-linux-deb/${APP}-${VERSION}-linux.deb"
          fi
          
          # macOS (.dmg)
          if [ -f ./artifacts/desktop-macos-dmg/*.dmg ]; then
            mv ./artifacts/desktop-macos-dmg/*.dmg "./artifacts/desktop-macos-dmg/${APP}-${VERSION}-macos.dmg"
          fi
          
          # iOS (.ipa)
          if [ -f ./artifacts/iosApp-unsigned/*.ipa ]; then
            mv ./artifacts/iosApp-unsigned/*.ipa "./artifacts/iosApp-unsigned/${APP}-${VERSION}-ios.ipa"
          fi

      - name: List artifacts (для отладки)
        run: ls -laR ./artifacts

      - name: Create Draft Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          draft: true
          prerelease: false
          make_latest: false

          files: |
            ./artifacts/desktop-windows-installer/ScheduleAAG-*.exe
            ./artifacts/desktop-windows-portable/ScheduleAAG-*.zip
            ./artifacts/desktop-linux-deb/ScheduleAAG-*.deb
            ./artifacts/desktop-macos-dmg/ScheduleAAG-*.dmg
            ./artifacts/iosApp-unsigned/ScheduleAAG-*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}